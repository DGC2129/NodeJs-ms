name: CI/CD for Patient Service

on:
  push:
    branches:
      - main
      - dev 
  pull_request:
    branches:
      - main
env:
  ECR_REPOSITORY: myrepo
  IMAGE_TAG: latest
  K8S_DEPLOYMENT: patient-service
  K8S_NAMESPACE: default

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install   

  # deploy-infra:
   # name: Deploy Infrastructure with Terraform
    #runs-on: ubuntu-latest
    #steps:
     # - name: Checkout Code
      #  uses: actions/checkout@v3

      #- name: Set Up Terraform
       # uses: hashicorp/setup-terraform@v2
        #with:
         # terraform_version: 1.3.0

      #- name: Initialize Terraform
       # run: |
        #  cd terraform
         # terraform version
          #terraform init
          
      - name: Validate Terraform    
        run: |
          terraform fmt
          terraform validate /*

      #- name: "Terraform Plan"
       # run: terraform plan

      #- name: "Terraform Apply"
       # run: |
        # if: github.ref == 'refs/heads/main'
        # terraform apply -auto-approve           

  docker-build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log into GH registry
        uses: actions/checkout@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.TMP_PAT_TOKEN }}            

      - name: Log in to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

      - name: docker build
        run: |         
          docker build -t my-ecr .
          docker tag my-ecr:latest ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${ECR_REPOSITORY}:${IMAGE_TAG}

      - name: docker Push
        run: |
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${ECR_REPOSITORY}:${IMAGE_TAG}   
          
  Deploy-to-EKS:
    needs: docker-build-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          
         # role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsEKS
         # aws-region: us-east-1 
        
      - name: Set up kubectl
        run: |
          aws eks update-kubeconfig --name hcl-eks-bs5zYHqX --region $AWS_REGION
          kubectl get nodes  # Verify authentication

      - name: Deploy Application to EKS
        run: |
          kubectl apply -f deployment.yaml
          kubectl apply -f patient-lb.yaml 
